<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <script>
      // Before first paint, as src/kit/theme.ts's initialThemeAttribute decides (a test runs this text against it):
      // ?theme=light|dark wins, then the stored choice; "system" leaves the attribute off.
      (() => {
        let stored = null
        try { stored = localStorage.getItem('ws-theme') } catch { /* storage blocked: follow the system theme */ }
        const fromUrl = new URLSearchParams(location.search).get('theme')
        const theme = fromUrl === 'light' || fromUrl === 'dark' ? fromUrl : stored === 'light' || stored === 'dark' ? stored : null
        if (theme) document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Advisor Desktop · Larkfield Advisory workspace (demo)</title>
    <meta name="description" content="A demo of a multiplayer workspace for the advisors of Larkfield Advisory, a fictional SEC-registered investment adviser: the advisor, the firm's agents, compliance and the client each see only what is theirs to see, and every binding step is a recorded act. By Joel Lewis." />
    <meta property="og:title" content="Advisor Desktop · Larkfield Advisory workspace (demo)" />
    <meta property="og:description" content="A demo workspace for a fictional investment adviser: threads where the advisor, the firm's agents, compliance and the client each see only their part, and every binding step is a recorded act." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://advisor.joelelewis.com" />
    <meta property="og:image" content="https://advisor.joelelewis.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:alt" content="The Brief in the Advisor Desktop workspace: today's calendar, then what needs a decision, each with its figure" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Advisor Desktop · Larkfield Advisory workspace (demo)" />
    <meta name="twitter:description" content="A demo workspace for a fictional investment adviser: threads where the advisor, the firm's agents, compliance and the client each see only their part, and every binding step is a recorded act." />
    <meta name="twitter:image" content="https://advisor.joelelewis.com/og-image.png" />
    <script defer src="https://cloud.umami.is/script.js" data-website-id="2c44b087-ed7b-4912-b35b-4604e37607ae" data-domains="advisor.joelelewis.com"></script>
  </head>
  <body class="antialiased">
    <div id="root">
      <!-- The first frame, until React replaces it: the workspace header and phone tab bar as WorkspaceShell draws them, so nothing moves when the app mounts. -->
      <div class="flex min-h-screen flex-col"><div class="flex-1 bg-bg text-ink">
        <header aria-hidden="true" class="mx-auto flex max-w-(--breakpoint-wide) flex-wrap items-center justify-between gap-x-6 gap-y-3 border-b border-ink px-6 py-3">
          <span class="inline-flex min-h-6 items-center gap-1 coarse:min-h-11 text-body font-semibold uppercase stretch-wide">Advisor Desktop</span>
          <ul class="order-last flex w-full flex-wrap gap-x-3 gap-y-1 text-label text-ink-3 split:order-none split:w-auto touch:hidden">
            <li class="inline-flex items-center gap-1.5"><kbd class="border border-ink-3 px-1">/</kbd><span class="normal-case">command</span></li>
            <li class="inline-flex items-center gap-1.5"><kbd class="border border-ink-3 px-1">?</kbd><span class="normal-case">keys</span></li>
          </ul>
          <div class="flex min-w-0 max-w-full flex-nowrap items-center gap-4">
            <span class="inline-flex min-w-0 max-w-full flex-wrap items-center gap-x-2 gap-y-1">
              <span class="text-label tracking-normal text-ink-3">View as</span>
              <span class="inline-flex min-h-9 coarse:min-h-11 max-w-full min-w-0 items-center overflow-hidden whitespace-nowrap border border-transparent py-1.5 pl-3 pr-8 text-body font-semibold text-transparent">Sarah Mitchell · Client service</span>
            </span>
            <span id="boot-theme-label" class="inline-flex min-h-6 coarse:min-h-11 items-center whitespace-nowrap text-body font-semibold underline decoration-rule-2 underline-offset-4">Theme: system (light)</span>
            <script>
              // The label ThemeToggle will draw, as themeLabel in src/kit/theme.ts words it (a test runs this text
              // against it), so the header keeps its width when the app replaces this frame.
              (() => {
                const label = document.getElementById('boot-theme-label')
                if (!label) return
                const theme = document.documentElement.getAttribute('data-theme')
                const systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches
                label.textContent = theme === 'light' || theme === 'dark' ? `Theme: ${theme}` : `Theme: system (${systemDark ? 'dark' : 'light'})`
              })()
            </script>
          </div>
        </header>
        <div aria-hidden="true" class="h-11 border-b border-ink narrow:hidden"></div>
        <p role="status" class="sr-only">Loading the workspace…</p>
      </div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
